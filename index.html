<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hive</title>
    <link rel="icon" type="image/svg+xml" href="/hive-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="view-bubbles theme-dark">
    <script>
      try {
        if (localStorage.getItem("hive-theme") === "light") {
          document.body.classList.add("theme-light");
          document.body.classList.remove("theme-dark");
        }
      } catch (e) {}
      // Capture OAuth handoff before React boots (hash/query can be lost otherwise).
      try {
        var tok = null;
        var q = new URLSearchParams(location.search);
        tok = q.get("h") || q.get("hive_token");
        if (tok) {
          q.delete("h");
          q.delete("hive_token");
          var qs = q.toString();
          history.replaceState(
            {},
            "",
            location.pathname + (qs ? "?" + qs : "")
          );
        }
        if (!tok && location.hash.length > 1) {
          var raw = location.hash.slice(1);
          var hp = new URLSearchParams(raw);
          tok = hp.get("h") || hp.get("hive_token");
          if (!tok && raw.indexOf("h=") === 0) {
            tok = decodeURIComponent(raw.slice(2));
          }
          if (tok) {
            history.replaceState({}, "", location.pathname + location.search);
          }
        }
        if (tok) localStorage.setItem("hive_session_token", tok);
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
